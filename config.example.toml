# Configurazione di Alfred.
# installa.sh la copia in ~/.config/alfred/config.toml: modifica quella.
# I segreti (token, password) vanno in ~/.config/alfred/secrets.env, non qui.

[generale]
# Come Alfred si rivolge a te.
appellativo = "signore"
# Porta del servizio (ascolta solo su 127.0.0.1).
porta = 7878

[meteo]
# Meteo da Open-Meteo (gratuito, senza chiave).
# Città vuota = Alfred usa la posizione del computer tramite GeoClue
# (si aggiorna da sola quando ci si sposta). Se GeoClue non è disponibile
# il riquadro del meteo resta nascosto.
citta = ""
# Città di casa: quando la posizione rilevata è nei dintorni (entro 5 km o
# entro l'errore di GeoClue) Alfred mostra questa invece del paese rilevato.
# casa = "Milano"
# In alternativa coordinate esplicite (hanno la precedenza sulla città):
# latitudine = 45.46
# longitudine = 9.19

[cervello]
# Alfred sceglie il modello in base al compito, riconosciuto in locale:
# - quotidiano: conversazione di tutti i giorni (leggero, consuma poco);
# - profondo: riflessioni, consigli, decisioni, lato cinico.
# Valori possibili: "haiku", "sonnet", "opus" (sconsigliato: consuma molto).
quotidiano = "haiku"
profondo = "sonnet"

[economia]
# Le riserve (limiti dell'abbonamento Claude) sono condivise con tutto il resto
# del tuo lavoro: Alfred si autolimita per non esaurirle.
# Oltre questa quota della settimana usa solo il modello quotidiano:
parsimonia_settimana = 0.5
# ...e lo stesso se consuma più in fretta di quanto passi la settimana
# (es. 0.15 = più di 15 punti oltre la quota di settimana trascorsa):
anticipo_sul_ritmo = 0.15
# Oltre queste quote smette di usare Claude (salvo "è importante"):
austerita_settimana = 0.8
austerita_sessione = 0.9

[gioco]
# Comando per la modalità gioco e nome del processo per capire se è già aperto.
# comando = ["steam", "-silent", "steam://rungameid/<id>"]
# processo = "Battle.net"

[obs]
# obs-websocket (OBS ≥ 28: Strumenti → Impostazioni server WebSocket).
host = "127.0.0.1"
porta = 4455
# Se il server ha la password: ALFRED_OBS_PASSWORD in secrets.env.
# Comando per aprire OBS, es. ["obs"] oppure ["flatpak", "run", "com.obsproject.Studio"]
comando_avvio = ["obs"]
