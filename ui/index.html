<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Alfred</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="stile.css">
</head>
<body>
  <header>
    <div class="orologio">
      <div id="ora" class="ora">--:--</div>
      <div id="data" class="data"></div>
    </div>
    <p id="saluto" class="saluto"></p>
    <p id="battuta" class="battuta"></p>
  </header>

  <main>
    <aside class="colonna">
      <article class="riquadro" id="riquadro-agenda" hidden>
        <h2>L'agenda</h2>
        <div id="agenda-giorni" class="agenda"></div>
      </article>

      <article class="riquadro" id="riquadro-regia" hidden>
        <h2>La regia</h2>
        <div id="regia-chiusa" hidden>
          <p class="tenue">OBS è chiuso.</p>
          <button class="pulsante" data-azione="apri_obs">Apri OBS</button>
        </div>
        <div id="regia-aperta" hidden>
          <dl class="misure">
            <dt>Diretta</dt><dd id="regia-diretta"></dd>
            <dt>Registrazione</dt><dd id="regia-registrazione"></dd>
          </dl>
          <div class="pulsanti">
            <button class="pulsante" id="pulsante-diretta"></button>
            <button class="pulsante" id="pulsante-registrazione"></button>
          </div>
          <div id="regia-scene" class="scene"></div>
        </div>
      </article>

      <article class="riquadro" id="riquadro-meteo" hidden>
        <h2>Il tempo</h2>
        <div class="meteo-ora">
          <span id="meteo-temp" class="grande"></span>
          <span id="meteo-desc"></span>
        </div>
        <p id="meteo-dettagli" class="tenue"></p>
        <ul id="meteo-giorni" class="giorni"></ul>
      </article>

      <article class="riquadro">
        <h2>La casa</h2>
        <dl class="misure">
          <dt>Processore</dt><dd><span id="cpu-uso"></span><div class="barra"><i id="cpu-barra"></i></div></dd>
          <dt>Temperatura</dt><dd id="cpu-temp"></dd>
          <dt>Grafica</dt><dd id="gpu-freq"></dd>
          <dt>Memoria</dt><dd><span id="ram-uso"></span><div class="barra"><i id="ram-barra"></i></div></dd>
          <dt>Disco</dt><dd id="disco"></dd>
          <dt>Batteria</dt><dd id="batteria"></dd>
          <dt>Rete</dt><dd id="rete"></dd>
        </dl>
      </article>
    </aside>

    <section class="riquadro conversazione">
      <h2>
        <span>Conversazione</span>
        <button id="nuova" class="pulsante-testo" title="Inizia una nuova conversazione">nuova conversazione</button>
      </h2>
      <div id="messaggi" class="messaggi"></div>
      <div id="attesa" class="attesa" hidden></div>
      <div id="conferma" class="conferma" hidden>
        <span id="conferma-domanda"></span>
        <button class="pulsante principale" id="conferma-si">Sì</button>
        <button class="pulsante" id="conferma-no">No</button>
      </div>
      <form id="modulo" class="modulo" autocomplete="off">
        <input id="domanda" type="text" placeholder="Mi dica, signore…" spellcheck="true">
      </form>
      <div id="riquadro-riserve" class="riserve" hidden>
        <span class="etichetta">Le riserve</span>
        <div class="riserva">
          <span>Sessione <b id="riserva-sessione"></b></span>
          <div class="barra"><i id="barra-sessione"></i></div>
        </div>
        <div class="riserva">
          <span>Settimana <b id="riserva-settimana"></b></span>
          <div class="barra"><i id="barra-settimana"></i></div>
        </div>
        <span id="riserve-note" class="nota"></span>
      </div>
    </section>
  </main>

  <footer class="tenue">Esc per congedare Alfred</footer>

  <script src="app.js"></script>
</body>
</html>
